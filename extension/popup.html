<!doctype html><html><head><meta charset="utf-8"><title>Qalam</title><style>body{margin:0;width:320px;font:14px/1.45 system-ui,sans-serif;color:#163431;background:#f9fbfa}main{padding:18px}h1{margin:0 0 8px;color:#0d4a45;font-size:20px}p{color:#526462}input,button{box-sizing:border-box;width:100%;border-radius:9px;padding:10px;margin-top:9px;font:inherit}input{border:1px solid #cddad8}button{border:0;background:#0d4a45;color:#fff;font-weight:700;cursor:pointer}.quiet{background:#fff;color:#0d4a45;border:1px solid #b9d2ce}.status{margin-top:10px;font-size:12px;color:#526462}</style></head><body><main><h1>Qalam for LinkedIn</h1><p>Generate selected-style comments with your existing Qalam allowance. Qalam never posts automatically.</p><button id="connect">Connect Qalam</button><input id="code" autocomplete="off" placeholder="Paste your connection code"><button id="save" class="quiet">Save connection</button><button id="disconnect" class="quiet">Disconnect this browser</button><p class="status" id="status">Not connected</p></main><script src="popup.js"></script></body></html>
